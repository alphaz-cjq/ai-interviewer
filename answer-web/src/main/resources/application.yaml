server:
  port: 8080

spring:
  # ========== 数据源 ==========
  datasource:
    url: jdbc:mysql://localhost:3306/ai_interviewer?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ========== Redis ==========
  data:
    redis:
      host: 192.168.100.128
      port: 6379
      # password: 你的Redis密码（没有就不写）
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1

  # ========== MQ ==========
  rabbitmq:
    host: 192.168.100.128
    port: 5672
    username: admin
    password: ${RABBITMQ_PASSWORD}
  # ========== 文件上传限制 ==========
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB


  # ========== Spring AI ==========

  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      chroma:
        initialize-schema: true
        collection-name: ai_interviewer
        client:
          host: http://192.168.100.128
          port: 8000


# ========== 文件上传配置 ==========
file:
  upload:
    base-dir: ${user.home}/ai-interviewer/uploads/resumes/

# ========== MyBatis-Plus ==========
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# ========== JWT ==========
jwt:
  secret: YourSecretKeyForJWT_ReplaceWithLongAndComplexString_AtLeast32Bytes
  expiration: 604800000

# ========== 日志 ==========
logging:
  level:
    com.cjq: debug
